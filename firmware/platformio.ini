; PlatformIO — PG-PROTO-001 ESP32 protection controller
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = default.csv

lib_deps =
  bblanchon/ArduinoJson @ ^7.2.1
  knolleary/PubSubClient @ ^2.8
  adafruit/Adafruit SH110X @ ^2.1.12
  adafruit/Adafruit GFX Library @ ^1.11.11
  adafruit/Adafruit BusIO @ ^1.14.5

build_flags =
  -DCORE_DEBUG_LEVEL=1
  -DDEMO_MODE=1
  ; Set DEMO_MODE=0 when real sensors are wired
  ; -DENABLE_GSM=0
  ; Override WiFi/MQTT via include/secrets.h
